<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-hidden="true">
  <!-- Pin actif: rouge + halo radial (pas feBlur, pas flare). Rond → point, 5s. Ancre [16,16]. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2302a" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#c2302a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c2302a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="13" fill="url(#halo)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="16" r="2.2" fill="#c2302a"/>
  <circle cx="16" cy="16" r="9" fill="none" stroke="#c2302a" stroke-width="1.6">
    <animate attributeName="r" values="9;9;2.2;2.2;9" keyTimes="0;0.08;0.72;0.88;1" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.6;1.6;0.6;0.6;1.6" keyTimes="0;0.08;0.72;0.88;1" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0.35;0;1" keyTimes="0;0.08;0.72;0.88;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
